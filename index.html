<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeatView · Elige tu asiento</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="stage"></div>

    <header id="topbar">
      <div class="brand">
        <span class="logo">◉</span>
        <div>
          <div class="brand-name">SeatView</div>
          <div class="event" id="eventName"></div>
        </div>
      </div>
      <div class="controls">
        <div class="seg" id="colorMode" role="group" aria-label="Colorear asientos por">
          <button data-mode="stadium" class="on">Estadio</button>
          <button data-mode="price">Precio</button>
          <button data-mode="view">Calidad de vista</button>
          <button data-mode="sun">Sol y sombra</button>
        </div>
        <div class="match" title="Fecha y hora del partido">
          <input type="date" id="matchDate" aria-label="Fecha del partido" />
          <select id="matchTime" aria-label="Hora del partido">
            <option>12:00</option><option>14:00</option><option selected>16:15</option>
            <option>18:30</option><option>21:00</option>
          </select>
          <span id="matchSky" class="sky-ico">☀️</span>
        </div>
        <label class="qty">Entradas
          <select id="qty">
            <option>1</option><option selected>2</option><option>3</option><option>4</option>
          </select>
        </label>
      </div>
    </header>

    <button id="backBtn" class="back hidden">← Vista general</button>
    <button id="enterBtn" class="enter">Elegir asiento →</button>
    <div id="hint" class="hint">Pasa el ratón por las gradas y haz clic en un sector</div>
    <div id="legend" class="legend hidden"></div>
    <div id="tooltip" class="tooltip hidden"></div>

    <aside id="panel" class="panel hidden">
      <div id="seatCard"></div>
      <div id="deals"></div>
    </aside>
    <div id="toast" class="toast hidden"></div>
    <div id="approx" class="approx">Modelo aproximado del estadio · datos públicos</div>
    <div id="loading" class="loading">
      <div class="loading-box">
        <div class="logo">◉</div>
        <div class="loading-title">SeatView</div>
        <div id="loadingMsg" class="loading-msg">Cargando…</div>
        <div class="loading-track"><div id="loadingBar" class="loading-bar"></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
